[project]
name = "ai-job-filter"
version = "0.1.0"
description = "Personal Telegram job filtering and scoring daemon"
requires-python = ">=3.12,<3.15"
readme = "README.md"

dependencies = [
    "telethon>=1.44",
    "python-telegram-bot>=22.0",
    "groq>=1.6",
    "google-genai>=2.19",
    "pydantic>=2.0",
    "pydantic-settings>=2.4",
    "aiosqlite>=0.20",
    "rapidfuzz>=3.14",
    "Pillow>=10.0",
    "structlog>=24.0",
    "tenacity>=9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.0",
]

[project.scripts]
ai-job-filter = "ai_job_filter.main:main"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires API keys and network (deselect with -m 'not integration')",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_job_filter"]
