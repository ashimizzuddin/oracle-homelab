services:
  ai-job-filter:
    build: .
    image: ai-job-filter:latest
    container_name: ai-job-filter
    restart: unless-stopped
    # Run as the host's ubuntu user (uid/gid 1001) so files written into the
    # mounted volumes keep ubuntu ownership — the systemd fallback stays usable.
    user: "1001:1001"
    env_file:
      - .env
    volumes:
      # SQLite DB + budget counters + downloads survive rebuilds
      - ./data:/app/data
      - ./downloads:/app/downloads
      # Editable without rebuild: candidate profile + fetcher config
      - ./candidate_profile.yaml:/app/candidate_profile.yaml:ro
      - ./config/web_fetchers.yaml:/app/config/web_fetchers.yaml:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - uptime-kuma-data:/app/data
    ports:
      - "127.0.0.1:3001:3001"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  uptime-kuma-data:
